name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # npm ci, not npm install. install quietly resolves anything the lockfile
      # is missing and writes the result into the runner's copy, which is how
      # the whole tiptap tree stayed absent from package-lock.json while CI
      # went green. ci fails instead, so the lockfile cannot drift unnoticed.
      - name: Install dependencies
        run: npm ci

      - name: Run build
        run: npm run build

      - name: Run typecheck
        run: npm run typecheck

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test
